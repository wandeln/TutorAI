              title: 'Neues Deck', enabled: true, script_chapters: [], sources: [], slides: null,
              material_id: null, slides_status: 'pending', slides_error: null,
            });
            markDirty('decks');
            rerenderList('decks');
            break;
          case 'chapter-del': {
            const i = parseInt(btn.dataset.idx, 10);
            if (chapters[i] && chapters[i].section_id) { showToast('Bestehende Kurs-Kapitel können nicht aus der Liste entfernt werden (nur deaktivieren).', 'error'); return; }
            if (chapters[i] && !confirm(`Kapitel „${chapters[i].title}“ entfernen?`)) return;
            chapters.splice(i, 1);
            markDirty('chapters');
            rerenderList('chapters');
            break;
          }
          case 'deck-del': {
            const i = parseInt(btn.dataset.idx, 10);
            if (decks[i] && decks[i].material_id) { showToast('Bestehende Kurs-Decks können nicht aus der Liste entfernt werden (nur deaktivieren).', 'error'); return; }
            if (decks[i] && !confirm(`Deck „${decks[i].title}“ entfernen?`)) return;
            decks.splice(i, 1);
            markDirty('decks');
            rerenderList('decks');
            break;
          }
          case 'script-start':
            await savePlan('chapters');
            await api('/script', { method: 'POST', body: JSON.stringify({}) });
            await refresh();
            break;
          case 'slides-start': {
            await savePlan('decks');
            const cb = document.getElementById('slides-del-cb');
            await api('/slides', { method: 'POST', body: JSON.stringify({ delete_original: cb ? cb.checked : false }) });
            await refresh();
            break;
          }
          case 'refine-start': {
            const scope = btn.dataset.scope === 'slides' ? 'slides' : 'script';
            await api('/refine', { method: 'POST', body: JSON.stringify({ scope }) });
            showToast(scope === 'script'
              ? 'Nachbesserung der Skript-Kapitel gestartet.'
              : 'Nachbesserung der Slide-Decks gestartet.', 'success');
            await refresh();
            break;
          }
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    root.addEventListener('change', (e) => {
      const t = e.target;
      if (t.matches('input[data-media]')) {
        if (t.checked) mediaSel.add(t.dataset.media);
        else mediaSel.delete(t.dataset.media);
        const label = t.closest('label');
        if (label) {
          label.classList.toggle('ring-2', t.checked);
          label.classList.toggle('ring-blue-500', t.checked);
        }
        const c = document.getElementById('media-actions');
        if (c && state) c.innerHTML = mediaActionsHTML(state);
      } else if (t.matches('input[data-ref]')) {
        if (t.checked) refSel.add(t.dataset.ref);
        else refSel.delete(t.dataset.ref);
        const label = t.closest('label');
        if (label) {
          label.classList.toggle('ring-1', t.checked);
          label.classList.toggle('ring-blue-400', t.checked);
          label.classList.toggle('bg-blue-50/40', t.checked);
        }
        const c = document.getElementById('ref-actions');
        if (c && state) c.innerHTML = refActionsHTML(state);
      } else if (t.matches('input[data-ch="enabled"]')) {
        const row = t.closest('.plan-row');
        const i = parseInt(row.dataset.idx, 10);
        if (chapters[i]) {
          chapters[i].enabled = t.checked;
          if (t.checked && chapters[i].script_status === 'done') {
            // Fertiges Kapitel wieder angehakt → Neu-Generierung anstehen
            chapters[i].script_status = 'pending';
            chapters[i].regen = true;
            row.setAttribute('data-regen', '1');
          } else if (chapters[i].regen) {
            chapters[i].regen = false;
            row.removeAttribute('data-regen');
          }
          markDirty('chapters');
        }
      } else if (t.matches('input[data-deck="enabled"]')) {
        const row = t.closest('.plan-row');
        const i = parseInt(row.dataset.idx, 10);
        if (decks[i]) {
          decks[i].enabled = t.checked;
          if (t.checked && decks[i].slides_status === 'done') {
            // Fertiges Deck wieder angehakt → Neu-Generierung anstehen
            decks[i].slides_status = 'pending';
            decks[i].regen = true;
            row.setAttribute('data-regen', '1');
          } else if (decks[i].regen) {
            decks[i].regen = false;
            row.removeAttribute('data-regen');
          }
          markDirty('decks');
        }
      } else if (t.dataset.existingSection != null) {
        const id = parseInt(t.dataset.existingSection, 10);
        const sc = (state.existing_sections || []).find((x) => x.id === id);
        if (!sc) return;
        const idx = chapters.findIndex((c) => c.section_id === id);
        if (t.checked) {
          if (idx === -1) {
            // Ghost-Zeile → Plan-Zeile (mit LLM-Beschreibung aus der Ghost-Zeile)
            chapters.push({
              title: sc.title, enabled: true,
              description: ghostSectionEdits[id] != null ? ghostSectionEdits[id] : (sc.description || ''),
              sources: [], sections: [sc.id], section_id: sc.id,
              script_status: 'pending', script_error: null,
            });
          } else {
            chapters[idx].enabled = true;
          }
        } else if (idx !== -1) {
          chapters[idx].enabled = false;
        }
        markDirty('chapters');
        rerenderList('chapters');
      } else if (t.dataset.existingDeck != null) {
        const id = parseInt(t.dataset.existingDeck, 10);
        const d0 = (state.decks || []).find((x) => x.id === id);
        if (!d0) return;
        const idx = decks.findIndex((d) => d.material_id === id);
        if (t.checked) {
          if (idx === -1) {
            // Ghost-Zeile → Plan-Zeile (mit LLM-Beschreibung aus der Ghost-Zeile)
            decks.push({
              title: d0.title, enabled: true,
              description: ghostDeckEdits[id] != null ? ghostDeckEdits[id] : (d0.description || ''),
              sources: [], sections: [], slides: null, material_id: d0.id,
              slides_status: 'pending', slides_error: null,
            });
          } else {
            decks[idx].enabled = true;
          }
        } else if (idx !== -1) {
          decks[idx].enabled = false;
        }
        markDirty('decks');
        rerenderList('decks');
      } else if (t.id === 'add-file') {
        if (t.files[0]) upload(t.files[0], 'add');
      } else if (t.id === 'slides-del-cb') {
        deleteOriginal = t.checked;
      }
    });

    root.addEventListener('input', (e) => {
      if (e.target.matches('input[data-ch="title"]')) {
        const row = e.target.closest('.plan-row');
        const i = parseInt(row.dataset.idx, 10);
        if (chapters[i]) { chapters[i].title = e.target.value; markDirty('chapters'); }
      } else if (e.target.matches('input[data-deck="title"]')) {
        const row = e.target.closest('.plan-row');
        const i = parseInt(row.dataset.idx, 10);
        if (decks[i]) { decks[i].title = e.target.value; markDirty('decks'); }
      } else if (e.target.matches('textarea[data-ch="description"]')) {
        const i = parseInt(e.target.dataset.idx, 10);
        if (chapters[i]) { chapters[i].description = e.target.value; markDirty('chapters'); }
      } else if (e.target.matches('textarea[data-deck="description"]')) {
        const i = parseInt(e.target.dataset.idx, 10);
        if (decks[i]) { decks[i].description = e.target.value; markDirty('decks'); }
      } else if (e.target.matches('textarea[data-ghost-section-desc]')) {
        // Ghost-Beschreibung: wird erst beim Anhaken Teil des Plans (kein markDirty)
        const id = parseInt(e.target.dataset.ghostSectionDesc, 10);
        ghostSectionEdits[id] = e.target.value;
      } else if (e.target.matches('textarea[data-ghost-deck-desc]')) {
        const id = parseInt(e.target.dataset.ghostDeckDesc, 10);
        ghostDeckEdits[id] = e.target.value;
      }
    });

    // Drag & Drop: nur per Griff (⠿) startbar, damit Textauswahl in den
    // Titel-Inputs nicht blockiert wird. Jede Liste (Kapitel/Decks) wird
    // separat sortiert.
    root.addEventListener('mousedown', (e) => {
      const handle = e.target.closest('.plan-drag');
      if (handle) handle.closest('.plan-row').draggable = true;
    });
    document.addEventListener('mouseup', () => {
      document.querySelectorAll('.plan-row[draggable="true"]').forEach((r) => { r.draggable = false; });
    });
    root.addEventListener('dragstart', (e) => {
      const row = e.target.closest('.plan-row');
      if (!row) return;
      dragIdx = parseInt(row.dataset.idx, 10);
      dragList = row.dataset.list;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(dragIdx));
      row.classList.add('opacity-50');
    });
    root.addEventListener('dragover', (e) => {
      // Zusätzliche Zip-Datei auf die Dropzone ziehen
      const dz = e.target.closest('#add-dropzone');
      if (dz) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        dz.classList.add('border-blue-400');
        return;
      }
      if (dragIdx === null) return;
      const row = e.target.closest('.plan-row');
      if (!row || row.dataset.list !== dragList) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    root.addEventListener('dragleave', (e) => {
      const dz = e.target.closest('#add-dropzone');
      if (dz) dz.classList.remove('border-blue-400');
    });
    root.addEventListener('drop', (e) => {
      // Zusätzliche Zip-Datei auf die Dropzone
      const dz = e.target.closest('#add-dropzone');
      if (dz) {
        e.preventDefault();
        dz.classList.remove('border-blue-400');
        const f = e.dataTransfer.files[0];
        if (f) upload(f, 'add');
        return;
      }
      const row = e.target.closest('.plan-row');
      if (!row || dragIdx === null || row.dataset.list !== dragList) return;
      e.preventDefault();
      const arr = dragList === 'chapters' ? chapters : decks;
      const to = parseInt(row.dataset.idx, 10);
      if (to !== dragIdx) {
        const [m] = arr.splice(dragIdx, 1);
        arr.splice(to, 0, m);
        markDirty(dragList);
        rerenderList(dragList);
      }
      dragIdx = null;
      dragList = null;
    });
    root.addEventListener('dragend', (e) => {
      const row = e.target.closest('.plan-row');
      if (row) row.classList.remove('opacity-50');
      dragIdx = null;
      dragList = null;
    });

    // Start
    refresh();
  })();
  </script>

    </div><!-- /content area -->
  </div><!-- /grid -->
{% endblock %}
