{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <div class="flex items-center gap-3 mb-2">
        <a href="/courses/{{ course.id }}" class="text-blue-600 hover:underline text-sm">
          ← {{ course.name }}
        </a>
        <span class="text-gray-400">/</span>
        <span class="text-sm text-gray-500">Übersicht</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Punktübersicht</h1>
    </div>
    <div class="flex gap-3">
      <button id="export-excel-btn"
              class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center gap-2 text-sm">
        📊 Excel exportieren
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-6">
    <div class="flex items-center gap-4 flex-wrap">
      <div class="flex-1 min-w-[200px]">
        <label class="block text-sm font-medium text-gray-700 mb-1">Filter</label>
        <input type="text" id="filter-input" placeholder="z.B. Blatt1, code, Rekursion..."
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Aufgabentyp</label>
        <select id="type-filter" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="">Alle</option>
          <option value="text">Textaufgaben</option>
          <option value="code">Codeaufgaben</option>
          <option value="mc">Multiple Choice</option>
        </select>
      </div>
      <div class="flex items-end">
        <button id="clear-filter-btn" class="text-gray-500 hover:text-gray-700 text-sm px-3 py-2">
          ✕ Filter löschen
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div id="loading-state" class="hidden text-center py-12">
    <div class="inline-flex items-center gap-2 text-blue-600">
      <span class="animate-spin">⏳</span>
      <span>Daten werden geladen...</span>
    </div>
  </div>

  <!-- Overview Table -->
  <div id="table-container" class="table-container">
    <table class="w-full border-collapse" id="overview-table">
      <thead id="table-header">
        <!-- Wird dynamisch per JS gefüllt -->
      </thead>
      <tbody id="table-body">
        <!-- Wird dynamisch per JS gefüllt -->
      </tbody>
    </table>
  </div>

  <!-- Summary Stats -->
  <div id="summary-stats" class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-4">
    <!-- Wird dynamisch per JS gefüllt -->
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  const courseId = {{ course.id }};

  // ─── Load Overview Data ─────────────────────────────────────
  async function loadOverview(filterText = '', typeFilter = '') {
    const loading = document.getElementById('loading-state');
    const tableContainer = document.getElementById('table-container');

    loading.classList.remove('hidden');
    tableContainer.classList.add('hidden');

    try {
      const params = new URLSearchParams({ filter_text: filterText });
      if (typeFilter) params.set('type_filter', typeFilter);

      const res = await fetch(`/api/courses/${courseId}/overview?${params}`, {
        credentials: 'same-origin',
      });

      const data = await res.json();

      if (!res.ok) {
        showToast(data.detail || 'Fehler beim Laden.', 'error');
        return;
      }

      renderTable(data);
      renderStats(data);

    } catch (err) {
      showToast(`Fehler: ${err.message}`, 'error');
    } finally {
      loading.classList.add('hidden');
      tableContainer.classList.remove('hidden');
    }
  }

  // ─── Render Table ───────────────────────────────────────────
  function renderTable(data) {
    const thead = document.getElementById('table-header');
    const tbody = document.getElementById('table-body');

    // Header
    let headerHtml = '<tr class="bg-gray-100">';
    headerHtml += '<th class="text-left py-3 px-4 font-semibold text-gray-700 border-b sticky left-0 bg-gray-100 z-10">Name</th>';
    headerHtml += '<th class="text-left py-3 px-4 font-semibold text-gray-700 border-b">Matr.-Nr.</th>';

    data.tasks.forEach(task => {
      const typeBadge = {
        text: '📝', code: '💻', mc: '☑️'
      }[task.task_type] || '📋';
      headerHtml += `<th class="text-center py-3 px-3 font-semibold text-gray-700 border-b text-xs" title="${task.title}">
        ${typeBadge} ${task.title.split(':').pop()?.trim() || task.title}
        <br><span class="text-gray-400 font-normal">${task.max_points}P</span>
      </th>`;
    });

    headerHtml += '<th class="text-center py-3 px-4 font-bold text-gray-800 border-b bg-blue-50">Summe</th>';
    headerHtml += '<th class="text-center py-3 px-4 font-bold text-gray-800 border-b bg-blue-50">Anteil</th>';
    headerHtml += '</tr>';
    thead.innerHTML = headerHtml;

    // Body
    const maxTotal = data.tasks.reduce((sum, t) => sum + t.max_points, 0);

    let bodyHtml = '';
    data.students.forEach(student => {
      bodyHtml += `<tr class="hover:bg-gray-50 transition">`;
      bodyHtml += `<td class="py-2 px-4 font-medium text-gray-900 border-b sticky left-0 bg-white">${student.name}</td>`;
      bodyHtml += `<td class="py-2 px-4 text-sm text-gray-500 border-b font-mono">${student.username}</td>`;

      let totalPoints = 0;
      data.tasks.forEach(task => {
        const points = data.scores[student.id]?.[task.id] || 0;
        totalPoints += points;
        const pct = task.max_points > 0 ? points / task.max_points : 0;
        const cellClass = pct >= 0.8 ? 'score-pass' : pct >= 0.5 ? 'score-warning' : 'score-fail';
        const bgClass = pct >= 0.8 ? 'bg-green-50' : pct >= 0.5 ? 'bg-yellow-50' : points > 0 ? 'bg-red-50' : 'bg-gray-50';

        bodyHtml += `<td class="py-2 px-3 text-center border-b ${bgClass} font-mono text-sm" title="${task.title}: ${points}/${task.max_points}">
          ${points > 0 ? points : '-'}
        </td>`;
      });

      const pctTotal = maxTotal > 0 ? (totalPoints / maxTotal * 100) : 0;
      const sumColor = pctTotal >= 80 ? 'text-green-700' : pctTotal >= 50 ? 'text-yellow-700' : 'text-red-700';

      bodyHtml += `<td class="py-2 px-4 text-center font-bold border-b bg-blue-50 ${sumColor}">${totalPoints}</td>`;
      bodyHtml += `<td class="py-2 px-4 text-center font-bold border-b bg-blue-50 ${sumColor}">${pctTotal.toFixed(1)}%</td>`;
      bodyHtml += '</tr>';
    });

    tbody.innerHTML = bodyHtml;
  }

  // ─── Render Summary Stats ───────────────────────────────────
  function renderStats(data) {
    const statsDiv = document.getElementById('summary-stats');
    const students = data.students;
    const tasks = data.tasks;
    const maxTotal = tasks.reduce((sum, t) => sum + t.max_points, 0);

    if (students.length === 0) {
      statsDiv.innerHTML = '<p class="text-gray-400 col-span-4">Keine Studenten im Kurs.</p>';
      return;
    }

    // Calculate stats
    let avgPoints = 0;
    let maxPoints = 0;
    let minPoints = Infinity;
    let passed50 = 0;

    students.forEach(student => {
      const total = student.total_points || 0;
      avgPoints += total;
      if (total > maxPoints) maxPoints = total;
      if (total < minPoints) minPoints = total;
      if (maxTotal > 0 && total / maxTotal >= 0.5) passed50++;
    });

    avgPoints = students.length > 0 ? avgPoints / students.length : 0;
    minPoints = minPoints === Infinity ? 0 : minPoints;

    statsDiv.innerHTML = `
      <div class="card text-center">
        <div class="text-2xl font-bold text-blue-600">${students.length}</div>
        <div class="text-sm text-gray-500">Studenten</div>
      </div>
      <div class="card text-center">
        <div class="text-2xl font-bold text-green-600">${avgPoints.toFixed(1)}</div>
        <div class="text-sm text-gray-500">Ø Punkte</div>
      </div>
      <div class="card text-center">
        <div class="text-2xl font-bold text-purple-600">${maxPoints} / ${minPoints}</div>
        <div class="text-sm text-gray-500">Max / Min</div>
      </div>
      <div class="card text-center">
        <div class="text-2xl font-bold ${passed50 === students.length ? 'text-green-600' : 'text-orange-600'}">${passed50}</div>
        <div class="text-sm text-gray-500">≥ 50% erreicht</div>
      </div>
    `;
  }

  // ─── Filter Events ──────────────────────────────────────────
  let filterTimeout;

  document.getElementById('filter-input').addEventListener('input', (e) => {
    clearTimeout(filterTimeout);
    filterTimeout = setTimeout(() => loadOverview(e.target.value, document.getElementById('type-filter').value), 300);
  });

  document.getElementById('type-filter').addEventListener('change', (e) => {
    loadOverview(document.getElementById('filter-input').value, e.target.value);
  });

  document.getElementById('clear-filter-btn').addEventListener('click', () => {
    document.getElementById('filter-input').value = '';
    document.getElementById('type-filter').value = '';
    loadOverview('', '');
  });

  // ─── Excel Export ───────────────────────────────────────────
  document.getElementById('export-excel-btn').addEventListener('click', async () => {
    const filterText = document.getElementById('filter-input').value;

    try {
      const params = new URLSearchParams({ filter_text: filterText });
      const res = await fetch(`/api/courses/${courseId}/export-excel?${params}`, {
        method: 'POST',
        credentials: 'same-origin',
      });

      if (!res.ok) {
        const data = await res.json();
        showToast(data.detail || 'Export fehlgeschlagen.', 'error');
        return;
      }

      // Download file
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const filename = `punktestand_{{ course.name | replace(' ', '_') }}.xlsx`;
      a.download = filename;
      a.click();
      window.URL.revokeObjectURL(url);

      showToast(`Excel-Datei "${filename}" heruntergeladen.`, 'success');

    } catch (err) {
      showToast(`Export-Fehler: ${err.message}`, 'error');
    }
  });

  // ─── Initial Load ───────────────────────────────────────────
  loadOverview();
</script>
{% endblock %}
